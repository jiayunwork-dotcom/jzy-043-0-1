# TaskForge — one command brings up the whole system:
#   docker compose up --build
#
# Services:
#   postgres  : source of truth (tasks, attempts, workers, dags, audit)
#   redis     : ready queues, delay zone, inflight leases
#   backend   : Go 1.22 + Fiber engine + HTTP API
#   frontend  : Nuxt 3 SPA served by nginx, proxying /api to the backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://taskforge:taskforge@postgres:5432/taskforge?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      QUEUE_DRIVER: "redis"
      HTTP_ADDR: ":8080"
      WORKER_COUNT: "3"
      SLOTS_PER_WORKER: "4"
      FAIRNESS_THRESHOLD: "5"
      DISPATCH_INTERVAL: "50ms"
      DELAY_SCAN_INTERVAL: "250ms"
      HEARTBEAT_INTERVAL: "3s"
      WORKER_TIMEOUT: "15s"
      LEASE_TTL: "15s"
      SHUTDOWN_TIMEOUT: "30s"
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
